[versions]
# ponytail: toolchain pinned to Google AI Edge Gallery 1.0.19 (Kotlin, AGP); bump together with Gallery.
kotlin = "2.4.20"
agp = "8.13.0"
composeMultiplatform = "1.9.3"
coroutines = "1.10.2"
activityCompose = "1.10.1"
litertlm = "0.18.1"
androidxTestRunner = "1.6.2"
androidxTestExtJunit = "1.2.1"
okio = "3.16.0"
androidxSqlite = "2.6.1"
playServicesLocation = "21.3.0"
biometric = "1.1.0"
# biometric 1.1.0 pulls fragment 1.2.5, whose FragmentActivity rejects the Activity Result API request codes
fragment = "1.7.1"
work = "2.10.1"
billing = "9.1.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
okio-fakefilesystem = { module = "com.squareup.okio:okio-fakefilesystem", version.ref = "okio" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "androidxSqlite" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidxSqlite" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
litertlm-android = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litertlm" }
play-billing-ktx = { module = "com.android.billingclient:billing-ktx", version.ref = "billing" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
